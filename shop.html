<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHOP BY CATEGORY</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI';
    background: linear-gradient(to bottom right, #e8e0fa, #c5b7ea);
   height: 100vh;
}

header {
    text-align: center;
    padding: 20px 0;
}

h1 {
    font-size: 32px;
    letter-spacing: 1px;
}


.category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
    padding: 30px;
}

.category-card {
    background: #fff;
    border-radius: 12px;
    text-align: center;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s ease;
    cursor: pointer;
}

.category-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.category-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
}

.category-card h3 {
    margin-top: 15px;
    font-size: 18px;
    font-weight: 600;
}
   
  </style>
</head>
<body>

    <header>
        <h1>SHOP BY CATEGORY</h1>
    </header>

    <section class="category-grid">

        <div class="category-card">
           <a href="#"> <img src="women.jpeg" alt="Women"></a>
            <h3>Women</h3>
        </div>


        <div class="category-card">

        </div>

        </div>

        <div class="category-card">

        </div>

    </section>
